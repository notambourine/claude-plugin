name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Repo-invariant gates. Nothing here reads the OS, so one runner is the whole coverage:
  # a second would re-derive the same answer from the same committed JSON.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install Claude Code CLI
        run: sfw npm install -g @anthropic-ai/claude-code

      # Deliberately uncached and wrapped: no step in this job reads node_modules. The
      # install is here so the firewall sees every fetch in the lockfile once per PR,
      # which is the gate the cached installs in `portable` below are allowed to skip.
      - name: Install dependencies
        run: sfw npm ci

      # Schema-validates marketplace.json, plugin.json, and skill/agent/hook
      # frontmatter. Runs without --strict on purpose: this plugin ships no
      # version field by design, and --strict promotes that "no version"
      # warning to a hard error. Genuine schema errors still fail the step.
      - name: Validate plugin + marketplace schema
        run: claude plugin validate .

      # Every plugin that lives here is nt-prefixed, so `/nt-` lists this
      # practice's commands and nothing else. A remote row is named for what it
      # does, because an outside user finds it by that name, not by our prefix.
      - name: Check nt- prefix on local plugins
        run: |
          bad=$(jq -r '.plugins[] | select(.source | type == "string")
                        | select(.name | startswith("nt-") | not) | .name' \
                 .claude-plugin/marketplace.json)
          [ -z "$bad" ] || { echo "::error::local plugin missing nt- prefix: $bad"; exit 1; }
          echo "all local plugins are nt-prefixed"

      # claude plugin validate does NOT check that the two description fields
      # agree -- they are allowed to differ by design. This repo keeps them in
      # sync deliberately, so guard against silent drift. Covers local plugins
      # only; a remote row's description is a point-in-time copy of the one in
      # that repo, and nothing here can see it drift.
      - name: Check description parity (plugin.json <-> marketplace.json)
        run: |
          fail=0
          while read -r name src; do
            case "$src" in ./*) ;; *) continue ;; esac
            plugin_desc=$(jq -r '.description' "$src/.claude-plugin/plugin.json")
            market_desc=$(jq -r --arg n "$name" \
              '.plugins[] | select(.name == $n) | .description' \
              .claude-plugin/marketplace.json)
            if [ "$plugin_desc" != "$market_desc" ]; then
              echo "::error::description drift for $name"
              echo "  $src/.claude-plugin/plugin.json: $plugin_desc"
              echo "  marketplace.json:                $market_desc"
              fail=1
            else
              echo "$name: descriptions match"
            fi
          done < <(jq -r '.plugins[] | select(.source | type == "string")
                          | "\(.name) \(.source)"' .claude-plugin/marketplace.json)
          exit $fail

  # The cross-platform half. These four gates are the only ones whose answer can differ
  # by OS, and the practice runs on macOS while CI runs on Linux, so each is the other's
  # only witness: .gitattributes keeping the checkout at LF, the mirror scripts keying
  # their trees by forward slash whatever node:path reports, and the hooks resolving a
  # body-file path the shell handed them. Every script below is node and git only, so
  # neither leg needs an OS carve-out.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Tarballs only, keyed by lockfile and runner OS. The unpack still runs every
          # leg, which is the cheap half here: the tree is a handful of dev deps.
          cache: npm

      # Unwrapped on purpose. The `validate` job puts this same lockfile through the
      # firewall on every PR, so the fetch-time gate has already seen this package set
      # and a cache hit here skips nothing that gate covers.
      - name: Install dependencies
        run: npm ci

      # A plugin install runs no npm, so nt-brand's skill directory has to be committed
      # bytes. This is the only thing standing between a hand-edit there and a brand the
      # published package never said - a stale token or a drifted font byte.
      - name: Verify brand-kit mirror
        run: npm run brand

      # Offline half of the vendoring contract: vendor/pristine must still hash to the
      # manifest pins, so the merge base a `pull` reads is the bytes it was cut from.
      # The network half is vendor-skills.yml, weekly.
      - name: Verify vendored skill merge base
        run: node scripts/vendor-skills.mjs verify

      # A SKILL.md is prose an agent runs verbatim, and nothing else here puts it
      # through a shell. This is the only gate between a macOS-only invocation and a
      # teammate on Windows or Linux running it.
      - name: Check portable shell in first-party skills
        run: node scripts/check-portable.mjs

      # A hook runs on somebody's machine with no one reading its output, so its decision
      # table is the one thing here that has to be executable rather than reviewed.
      - name: Run plugin hook tests
        run: npm test
