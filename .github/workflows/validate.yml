name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install Claude Code CLI
        run: sfw npm install -g @anthropic-ai/claude-code

      # No consumer of node_modules here; the firewall needs to see every fetch once per PR.
      - name: Install dependencies
        run: sfw npm ci

      # No --strict: it fails the missing version field this plugin omits by design.
      - name: Validate plugin + marketplace schema
        run: claude plugin validate .

      # Remote rows are exempt: an outside user finds one by what it does, not our prefix.
      - name: Check nt- prefix on local plugins
        run: |
          bad=$(jq -r '.plugins[] | select(.source | type == "string")
                        | select(.name | startswith("nt-") | not) | .name' \
                 .claude-plugin/marketplace.json)
          [ -z "$bad" ] || { echo "::error::local plugin missing nt- prefix: $bad"; exit 1; }
          echo "all local plugins are nt-prefixed"

      # claude plugin validate does not compare these two fields; drift is silent.
      - name: Check description parity (plugin.json <-> marketplace.json)
        run: |
          fail=0
          while read -r name src; do
            case "$src" in ./*) ;; *) continue ;; esac
            plugin_desc=$(jq -r '.description' "$src/.claude-plugin/plugin.json")
            market_desc=$(jq -r --arg n "$name" \
              '.plugins[] | select(.name == $n) | .description' \
              .claude-plugin/marketplace.json)
            if [ "$plugin_desc" != "$market_desc" ]; then
              echo "::error::description drift for $name"
              echo "  $src/.claude-plugin/plugin.json: $plugin_desc"
              echo "  marketplace.json:                $market_desc"
              fail=1
            else
              echo "$name: descriptions match"
            fi
          done < <(jq -r '.plugins[] | select(.source | type == "string")
                          | "\(.name) \(.source)"' .claude-plugin/marketplace.json)
          exit $fail

  # Every script below is node and git only; a step that shells out needs an OS carve-out.
  portable:
    # Serialized to keep a malformed manifest from paying for a macOS leg at 10x.
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Unwrapped and cached: `validate` already put this lockfile through the firewall.
      - name: Install dependencies
        run: npm ci

      # A plugin install runs no npm, so the skill directory has to be committed bytes.
      - name: Verify brand-kit mirror
        run: npm run brand

      # Offline half of the vendoring contract; vendor-skills.yml covers the network half.
      - name: Verify vendored skill merge base
        run: node scripts/vendor-skills.mjs verify

      - name: Check portable shell in first-party skills
        run: node scripts/check-portable.mjs

      - name: Run plugin hook tests
        run: npm test
